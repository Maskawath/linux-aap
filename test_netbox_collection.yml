---
- name: Validate NetBox Connectivity via Custom EE
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Query NetBox for existing Sites (Read-Only)
      netbox.netbox.netbox_site_info:
        validate_certs: false # Set to true in prod with valid CA certs
      register: nb_sites

    - name: Output Connection Result
      ansible.builtin.debug:
        msg: "SUCCESS! Connected to NetBox via pynetbox. Found {{ nb_sites.netbox_sites | length }} sites."
