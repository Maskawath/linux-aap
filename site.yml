---
- name: Manage NetBox Sites (Create test-site and List Sites)
  hosts: localhost
  gather_facts: false
  vars:
    # HTTP NetBox API Connection Variables
    netbox_url: "{{ lookup('env', 'NETBOX_URL') | default('http://netbox.mylab.local', true) }}"
    netbox_token: "{{ lookup('env', 'NETBOX_TOKEN') | default('your_netbox_api_token_here', true) }}"

  tasks:
    - name: 1. Create site 'test-site' in NetBox
      netbox.netbox.netbox_site:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_token }}"
        validate_certs: false
        data:
          name: "test-site"
          slug: "test-site"
          status: "active"
        state: present
      register: create_site_result

    - name: Display creation result for 'test-site'
      ansible.builtin.debug:
        msg: "Created/Verified 'test-site': {{ create_site_result }}"

    - name: 2. Query NetBox for existing Sites (Read-Only)
      netbox.netbox.netbox_site_info:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_token }}"
        validate_certs: false
      register: netbox_sites

    - name: Display list of all Site Names
      ansible.builtin.debug:
        msg: "NetBox Sites: {{ netbox_sites.sites | map(attribute='name') | list }}"

    - name: Print individual Site Names and details
      ansible.builtin.debug:
        msg: "Site Name: {{ item.name }} | Slug: {{ item.slug }} | Status: {{ item.status.label | default(item.status) }}"
      loop: "{{ netbox_sites.sites }}"
      loop_control:
        label: "{{ item.name }}"



