---
- name: Manage NetBox Sites (Create test-site and List Sites)
  hosts: localhost
  gather_facts: false
  vars:
    # HTTP NetBox API Connection Variables
    netbox_url: "{{ lookup('env', 'NETBOX_URL') | default('http://netbox.mylab.local', true) }}"
    netbox_token: "{{ lookup('env', 'NETBOX_TOKEN') | default('your_netbox_api_token_here', true) }}"

  tasks:
    - name: 1. Create site 'test-site' in NetBox
      netbox.netbox.netbox_site:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_token }}"
        validate_certs: false
        data:
          name: "test-site"
          slug: "test-site"
          status: "active"
        state: present
 




